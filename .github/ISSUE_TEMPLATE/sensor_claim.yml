# Generated from catalog/sensors.json. Don't edit by hand: run `npm run catalog` in frontend/.
name: I'm building this
description: Claim a help-wanted sensor or integration work, so nobody else builds it at the same time.
title: "Building: "
labels: ["in progress"]
body:
  - type: markdown
    attributes:
      value: |
        **The rule:** new sensor on Zigbee2MQTT = add a profile file. ZHA/Matter or any change to discovery/core = describe your approach below and wait for the maintainer's approval before writing code.
  - type: dropdown
    id: sensor
    attributes:
      label: Sensor or work
      options:
        - "Aqara FP1E (Profile file)"
        - "Aqara FP310 (Profile file)"
        - "Aqara FP1 (Issue first: new Regions mode)"
        - "Aqara P1 motion sensor (Issue first: new Cone mode)"
        - "Aqara High Precision motion sensor (RTCGQ13LM) (Issue first: new Cone mode)"
        - "Aqara P2 motion sensor (Issue first: new Cone mode, Thread/Matter)"
        - "Aqara FP400 (Issue first: new Map mode)"
        - "ZHA support (Issue first)"
        - "Thread/Matter support (Issue first)"
    validations:
      required: true
  - type: dropdown
    id: integration
    attributes:
      label: How is your sensor connected?
      options:
        - Zigbee2MQTT
        - ZHA
        - Thread/Matter
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Your approach
      description: For a profile file, a sentence is enough. For a new mode or ZHA/Matter, describe what you'd change and how Blip would draw it.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I own the sensor(s) and will test on my own Home Assistant, with a walk-test screen recording.
          required: true
