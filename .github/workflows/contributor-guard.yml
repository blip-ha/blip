name: Contributor guard

# Helps sensor contributions land smoothly and keeps the app stable. For pull requests from
# anyone but the maintainer, it checks:
#   1. Files: a sensor contribution adds one new profile (data, not code). Generated files are
#      rebuilt after merge (sync-generated.yml). Other changes start with an approved issue and
#      get the maintainer-approved label.
#   2. Testing details in the pull request text: Home Assistant version, integration
#      (Zigbee2MQTT/ZHA/Matter) and a walk-test screen recording.
# The maintainer-approved label skips both: it means the maintainer has reviewed the change
# and its testing directly, so the checklist has done its job.
#
# Why pull_request_target: this workflow and its script always come from the base branch, so a
# pull request can't edit or switch off the guard. It never checks out or runs the pull
# request's code: it reads the changed file names from the GitHub API and the PR text from
# the event. The rules live in .github/scripts/contributor-guard.sh and are self-tested in CI.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    name: Contributor guard
    runs-on: ubuntu-latest
    # The maintainer's pull requests and Dependabot's dependency updates (which the maintainer
    # reviews and merges) don't need the contributor checks.
    if: ${{ !contains(fromJSON('["dbalaska32", "dependabot[bot]"]'), github.event.pull_request.user.login) }}
    steps:
      - name: Check out the guard (base branch, not the pull request)
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Check which files this pull request changes
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'maintainer-approved') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | [.status, .filename] | @tsv' > changes.tsv
          bash .github/scripts/contributor-guard.sh files < changes.tsv || {
            echo "::error::Sensor contributions add one file in profiles/; see the list above and CONTRIBUTING.md. Questions are welcome in the pull request."
            exit 1
          }
      - name: Check the testing details in the pull request text
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'maintainer-approved') }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          bash .github/scripts/contributor-guard.sh body || {
            echo "::error::Almost there: add the testing details listed above to the pull request text. This check re-runs when you edit it."
            exit 1
          }
