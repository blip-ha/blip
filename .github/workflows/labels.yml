name: Labels

# Creates and updates the repository's labels from .github/labels.json.
on:
  push:
    paths:
      - .github/labels.json
      - .github/workflows/labels.yml
  workflow_dispatch:

permissions:
  contents: read   # to check out the private repo
  issues: write    # to create and update labels

jobs:
  sync:
    name: Sync labels
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create or update labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -c '.[]' .github/labels.json | while read -r label; do
            name=$(jq -r .name <<<"$label")
            gh label create "$name" --repo "$GITHUB_REPOSITORY" --force \
              --color "$(jq -r .color <<<"$label")" \
              --description "$(jq -r .description <<<"$label")"
            echo "synced: $name"
          done
